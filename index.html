<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NotePlanner · 笔记管理面板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">N</span><span>NotePlanner</span></div>
    <button class="new-note" id="new-collection"><span>＋</span> 新建聚合体 <kbd>N</kbd></button>
    <nav class="main-nav" aria-label="主导航">
      <a class="nav-item active" href="#all-notes"><span class="nav-icon">▤</span> 所有笔记 <strong>6</strong></a>
      <a class="nav-item" href="#favorites"><span class="nav-icon">☆</span> 收藏夹 <strong>2</strong></a>
      <a class="nav-item" href="#archive"><span class="nav-icon">□</span> 归档 <strong>1</strong></a>
      <a class="nav-item" href="#trash"><span class="nav-icon">♧</span> 回收站</a>
    </nav>
    <div class="sidebar-section">
      <div class="section-label">标签 <button aria-label="添加标签">＋</button></div>
      <a class="tag-link" href="#work"><span class="tag-dot coral"></span>工作</a>
      <a class="tag-link" href="#ideas"><span class="tag-dot purple"></span>灵感</a>
      <a class="tag-link" href="#reading"><span class="tag-dot blue"></span>阅读</a>
      <a class="tag-link" href="#life"><span class="tag-dot green"></span>生活</a>
    </div>
    <div class="sidebar-footer"><div class="profile"><span class="avatar">L</span><span><b>Lin</b><small>个人空间</small></span><span class="more">•••</span></div></div>
  </aside>

  <main class="content" id="all-notes">
    <header class="topbar"><div class="breadcrumbs"><span>我的空间</span><i>/</i><b>所有笔记</b></div><div class="top-actions"><button class="icon-button" id="theme-toggle">◐</button><button class="icon-button">⚙</button><div class="mini-avatar">L</div></div></header>
    <section class="page-heading"><div><p class="eyebrow">THURSDAY, JUNE 12, 2025</p><h1>笔记聚合体 <span id="collection-count">3</span></h1><p class="subtitle">先建立结构，再慢慢填充你的想法。</p></div><button class="view-toggle" id="view-toggle"><span>▦</span> 聚合视图 <span class="chevron">⌄</span></button></section>
    <section class="toolbar"><div class="search-box"><span>⌕</span><input id="search-input" type="search" placeholder="搜索聚合体或笔记..." /><kbd>⌘ K</kbd></div><div class="filter-actions"><button class="filter-button" id="filter-button">↕ <span>最近更新</span>⌄</button><button class="filter-button" id="filter-tag">标签⌄</button></div></section>
    <div class="filter-menu hidden" id="filter-menu"><button data-sort="recent">最近更新</button><button data-sort="oldest">最早创建</button><button data-sort="az">标题 A-Z</button></div>
    <div class="workspace">
      <section class="collections-panel"><div class="panel-heading"><span>我的聚合体</span><button id="add-collection">＋ 新建</button></div><div id="collections-list"></div></section>
      <section class="editor-panel" id="editor-panel">
        <div class="editor-header"><div><p class="eyebrow">MARKDOWN NOTE</p><h2 id="editor-title">选择一篇笔记</h2></div><div class="editor-actions"><span class="save-status" id="save-status">已保存</span><button id="preview-toggle">预览</button><button id="note-menu">•••</button></div></div>
        <div class="editor-body"><textarea id="markdown-editor" spellcheck="false" placeholder="选择一篇笔记后开始编辑 Markdown..."></textarea><article class="markdown-preview hidden" id="markdown-preview"></article></div>
        <div class="editor-footer"><span>支持 Markdown · 自动保存</span><span id="word-count">0 字</span></div>
      </section>
    </div>
    <footer class="content-footer"><span><span class="sync-dot"></span> 已同步</span><span>共 <b id="note-count">6</b> 篇笔记</span></footer>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
