<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NotePlanner · 笔记管理面板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=22" />
</head>
<body>
<div class="app-shell">
  <!-- ========== 侧边栏 ========== -->
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="brand-mark">N</span><span>NotePlanner</span></div>
    <nav class="main-nav" aria-label="主导航">
      <a class="nav-item" href="#collections" id="nav-collections"><span class="nav-icon">▦</span> 笔记集</a>
      <a class="nav-item" href="#loose" id="nav-loose"><span class="nav-icon">▤</span> 零散笔记</a>
      <a class="nav-item" href="#trash" id="nav-trash"><span class="nav-icon">♧</span> 回收站</a>
      <a class="nav-item" href="#search" id="nav-search"><span class="nav-icon">⌕</span> 搜索</a>
    </nav>
    <div class="sidebar-footer">
      <button class="sidebar-action-btn" id="btn-settings" title="设置"><span>⚙</span> 设置</button>
      <button class="sidebar-action-btn collapse-btn" id="btn-collapse" title="收起菜单栏"><span>◀</span> 收起</button>
    </div>
  </aside>

  <!-- ========== 侧边栏浮窗（收起后显示） ========== -->
  <button class="sidebar-fab" id="sidebar-fab" title="展开菜单栏"><span>N</span></button>

  <!-- ========== 主内容区 ========== -->
  <main class="content" id="main-content">
    <header class="topbar">
      <div class="breadcrumbs" id="breadcrumbs"><span>我的空间</span><i>/</i><b>笔记集</b></div>
      <div class="top-actions"><button class="icon-button" id="theme-toggle">◐</button></div>
    </header>

    <!-- ========== 笔记集视图 ========== -->
    <section class="view view-collections active" id="view-collections">
      <section class="page-heading"><div><h1>笔记集</h1></div></section>
      <div class="workspace">
        <section class="group-tree-panel">
          <div class="panel-heading"><span>主题视图</span><div class="panel-actions"><button id="add-group" title="新建主题">＋</button></div></div>
          <div id="group-tree"></div>
        </section>
        <section class="collections-panel">
          <div class="panel-heading"><span>我的笔记集</span><div class="panel-actions"><button id="add-collection">＋ 新建</button></div></div>
          <div id="collections-list"></div>
        </section>
        <section class="editor-panel" id="editor-panel">
          <div class="editor-header"><div><p class="eyebrow">MARKDOWN NOTE</p><h2 id="editor-title">选择一篇笔记</h2></div><div class="editor-actions"><span class="save-status" id="save-status">已保存</span><button id="preview-toggle">预览</button></div></div>
          <div class="editor-body"><textarea id="markdown-editor" spellcheck="false" placeholder="选择一篇笔记后开始编辑 Markdown..."></textarea><article class="markdown-preview hidden" id="markdown-preview"></article></div>
          <div class="editor-footer"><span>支持 Markdown · 自动保存</span><span id="word-count">0 字</span></div>
        </section>
      </div>
    </section>

    <!-- ========== 零散笔记视图 ========== -->
    <section class="view view-loose" id="view-loose">
      <section class="page-heading"><div><h1>零散笔记</h1></div></section>
      <section class="toolbar"><div class="filter-actions"><button class="filter-button" id="add-loose-note">＋ 新建笔记</button></div></section>
      <div class="workspace-loose">
        <section class="loose-list-panel">
          <div class="panel-heading"><span>笔记列表</span></div>
          <div id="loose-notes-list"></div>
        </section>
        <section class="editor-panel" id="loose-editor-panel">
          <div class="editor-header"><div><p class="eyebrow">MARKDOWN NOTE</p><h2 id="loose-editor-title">选择一篇笔记</h2></div><div class="editor-actions"><span class="save-status" id="loose-save-status">已保存</span><button id="loose-preview-toggle">预览</button></div></div>
          <div class="editor-body"><textarea id="loose-markdown-editor" spellcheck="false" placeholder="选择一篇笔记后开始编辑 Markdown..."></textarea><article class="markdown-preview hidden" id="loose-markdown-preview"></article></div>
          <div class="editor-footer"><span>支持 Markdown · 自动保存</span><span id="loose-word-count">0 字</span></div>
        </section>
      </div>
    </section>

    <!-- ========== 回收站视图 ========== -->
    <section class="view view-trash" id="view-trash">
      <section class="page-heading"><div><h1>回收站</h1></div></section>
      <section class="toolbar"><div class="filter-actions"><button class="filter-button danger" id="btn-empty-trash">清空回收站</button></div></section>
      <section class="trash-panel">
        <div class="panel-heading"><span>已删除的笔记</span><span class="panel-count" id="trash-count">0</span></div>
        <div class="trash-list" id="trash-list"></div>
      </section>
    </section>

    <!-- ========== 搜索视图 ========== -->
    <section class="view view-search" id="view-search">
      <section class="page-heading"><div><h1>搜索</h1></div></section>
      <section class="toolbar"><div class="search-box big"><span>⌕</span><input id="global-search" type="search" placeholder="搜索所有笔记…（标题与正文，支持 Ctrl/Cmd+K 唤起）" /></div></section>
      <div class="search-stats" id="search-stats"></div>
      <div class="search-results" id="search-results"></div>
    </section>

  </main>
  <div class="collapse-dock" id="collapse-dock">
    <button class="circle-btn" id="dock-collapse" title="收起面板" aria-label="收起面板"><span class="cd-chev">‹</span></button>
    <button class="circle-btn" id="dock-expand" title="展开面板" aria-label="展开面板"><span class="cd-chev">›</span></button>
  </div>
</div>

<!-- ========== 统一弹窗容器 ========== -->
<div class="modal-backdrop hidden" id="modal-backdrop">
  <div class="modal" id="modal-container">
    <!-- 动态内容注入 -->
  </div>
</div>

<!-- ========== Toast ========== -->
<div class="toast" id="toast" role="status"></div>

<script src="app.js?v=13"></script>
</body>
</html>
